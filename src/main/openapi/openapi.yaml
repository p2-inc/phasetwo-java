openapi: 3.0.2
info:
  description: |
    This is a REST API reference for the Phase Two Keycloak extensions. These are extensions to the standard [Keycloak Admin REST API](https://www.keycloak.org/docs-api/latest/rest-api/index.html), and run on your cluster alongside it.

    ### Base URI format
    Paths specified in the documentation are relative to the base URI.
    - Format: `https://<your-cluster-host>/auth/realms`
    - Example: `https://auth.example.com/auth/realms`

    `<your-cluster-host>` is your cluster's hostname from the Phase Two Dashboard, or a custom domain attached to it.

    ### Authentication
    Send an access token in the `Authorization: Bearer <token>` header of every request. We recommend getting the token for a [service account](https://phasetwo.io/docs/api/service-accounts) with the client credentials grant, using a confidential client you create for API access.

    A Keycloak admin client library, such as the [Keycloak Admin Client for JavaScript](https://github.com/keycloak/keycloak/tree/main/js/libs/keycloak-admin-client), can take care of getting an access token and refreshing it when it expires.

    #### Client credentials grant example
    ```
    POST /auth/realms/my-realm/protocol/openid-connect/token
    Host: auth.example.com
    Accept: application/json
    Content-Type: application/x-www-form-urlencoded

    grant_type=client_credentials&client_id=api-client&client_secret=<client-secret>
    ```

    The response contains the access token, its type, and its lifetime in seconds:
    ```json
    {
      "access_token": "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...",
      "token_type": "Bearer",
      "expires_in": 300
    }
    ```

    ### SDKs
    Modern API libraries are available for several common languages. These are available as open source at the links below, or you can choose to generate your own using our [OpenAPI spec file](https://raw.githubusercontent.com/p2-inc/phasetwo-docs/main/openapi.yaml).

    | Language | Library |
    | --- | --- |
    | Java (and other JVM langs) | https://github.com/p2-inc/phasetwo-java |
    | JavaScript/TypeScript | https://github.com/p2-inc/phasetwo-js |
    | Python | https://github.com/p2-inc/phasetwo-python |
  title: Phase Two Admin REST API
  version: v1
externalDocs:
  description: Public documentation
  url: https://phasetwo.io/docs
servers:
- url: "{baseUrl}/realms"
  variables:
    baseUrl:
      default: https://app.phasetwo.io
      description: |
        API base URL without a trailing slash.
        Examples:
        - https://app.phasetwo.io
        - https://app.phasetwo.io/auth
        - http://localhost:8081
        - http://localhost:8081/auth
security:
- access_token: []
paths:
  /{realm}/orgs:
    get:
      description: Get a paginated list of organizations using optional search query
        parameters.
      operationId: getOrganizations
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      - description: search by name
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: first
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: max
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: search by attributes using the format (space separated) `k1:v1
          k2:v2`
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - description: search parameter exact match
        explode: true
        in: query
        name: exact
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/OrganizationRepresentation"
                type: array
          description: success
      summary: Get organizations
      tags:
      - Organizations
      x-accepts:
      - application/json
      x-tags:
      - tag: Organizations
    post:
      operationId: createOrganization
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationRepresentation"
        required: true
      responses:
        "201":
          description: success
          headers:
            Location:
              description: URI indicating the ID of the new resource.
              explode: false
              schema:
                type: string
              style: simple
      summary: Create a new organization
      tags:
      - Organizations
      x-p2-return-response: true
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Organizations
  /{realm}/orgs/count:
    get:
      description: Get a count of organizations using an optional search query.
      operationId: getOrganizationsCount
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: search by attributes using the format (space separated) `k1:v1
          k2:v2`
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - description: exact search
        explode: true
        in: query
        name: exact
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                format: int32
                type: integer
          description: success
      summary: Get organizations count
      tags:
      - Organizations
      x-accepts:
      - application/json
      x-tags:
      - tag: Organizations
  /{realm}/orgs/me:
    get:
      description: Get a list of all organizations that the user is a member and their
        roles in those organizations. Similar idea to /userinfo in OIDC.
      operationId: getMe
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyOrganizationsRepresentation"
          description: success
      summary: Get orgs and roles for authenticated user
      tags:
      - Organizations
      x-accepts:
      - application/json
      x-tags:
      - tag: Organizations
  /{realm}/orgs/me/invitations:
    get:
      description: Get a list of all invitations for the user.
      operationId: invitations
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationRepresentation"
          description: success
      summary: Get invitations for authenticated user
      tags:
      - Organizations
      x-accepts:
      - application/json
      x-tags:
      - tag: Organizations
  /{realm}/orgs/me/invitations/{invitationId}:
    delete:
      description: Reject invitation for authenticated user.
      operationId: rejectInvitation
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      - description: invitation UUID
        explode: false
        in: path
        name: invitationId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: success
      summary: Reject invitation for authenticated user
      tags:
      - Organizations
      x-accepts:
      - application/json
      x-tags:
      - tag: Organizations
    post:
      description: Accept invitation for authenticated user.
      operationId: acceptInvitation
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      - description: invitation UUID
        explode: false
        in: path
        name: invitationId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: success
      summary: Accept invitation for authenticated user
      tags:
      - Organizations
      x-p2-return-response: true
      x-accepts:
      - application/json
      x-tags:
      - tag: Organizations
  /{realm}/orgs/export:
    get:
      description: Export all organizations and their configurations from this realm
      operationId: exportOrganizations
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      - description: Include organization members in the export
        explode: true
        in: query
        name: includeMembers
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Include organization roles in the export
        explode: true
        in: query
        name: includeRoles
        required: false
        schema:
          default: true
          type: boolean
        style: form
      - description: Include identity providers in the export
        explode: true
        in: query
        name: includeIdps
        required: false
        schema:
          default: true
          type: boolean
        style: form
      - description: "Specific organization IDs to export (if not provided, exports\
          \ all)"
        explode: true
        in: query
        name: orgIds
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationsExportRepresentation"
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: success
      summary: Export organizations
      tags:
      - Organizations
      x-accepts:
      - application/json
      - application/octet-stream
      x-tags:
      - tag: Organizations
  /{realm}/orgs/import:
    post:
      description: Import organizations and their configurations into this realm
      operationId: importOrganizations
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      - description: Skip organizations that already exist instead of updating them
        explode: true
        in: query
        name: skipExisting
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Import organization members (requires existing users in realm)
        explode: true
        in: query
        name: importMembers
        required: false
        schema:
          default: false
          type: boolean
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationsImportRepresentation"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationsImportResultRepresentation"
          description: success
        "400":
          description: Invalid import data or format
        "409":
          description: Conflicts with existing organizations
      summary: Import organizations
      tags:
      - Organizations
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Organizations
  /{realm}/orgs/{orgId}:
    delete:
      operationId: deleteOrganization
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      - description: organization id
        explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: success
      summary: Delete the organization
      tags:
      - Organizations
      x-accepts:
      - application/json
      x-tags:
      - tag: Organizations
    get:
      operationId: getOrganizationById
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      - description: organization id
        explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationRepresentation"
          description: success
      summary: Get organization by id
      tags:
      - Organizations
      x-accepts:
      - application/json
      x-tags:
      - tag: Organizations
    put:
      operationId: updateOrganization
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      - description: organization id
        explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationRepresentation"
        required: true
      responses:
        "204":
          description: success
      summary: Update this organization by id
      tags:
      - Organizations
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Organizations
  /{realm}/orgs/{orgId}/portal-link:
    post:
      description: "Create a link for this organization's IdP Wizard. This link encodes\
        \ an action token on behalf of the organization's default admin user, or the\
        \ user that is optionally specified in this request. The user specified must\
        \ be a member of this organization, and have full organization admin roles."
      operationId: createPortalLink
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      - description: organization id
        explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/createPortalLink_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalLinkRepresentation"
          description: success
      summary: Create a link for the organization's IdP Wizard
      tags:
      - Organizations
      x-content-type: application/x-www-form-urlencoded
      x-accepts:
      - application/json
      x-tags:
      - tag: Organizations
  /{realm}/orgs/config:
    get:
      description: Get the global organization configuration for this realm
      operationId: getOrganizationConfig
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationConfigRepresentation"
          description: success
      summary: Get organization configuration
      tags:
      - Organizations
      x-accepts:
      - application/json
      x-tags:
      - tag: Organizations
    put:
      description: Update the global organization configuration for this realm
      operationId: updateOrganizationConfig
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationConfigRepresentation"
        required: true
      responses:
        "204":
          description: success
        "400":
          description: Invalid configuration
      summary: Update organization configuration
      tags:
      - Organizations
      x-p2-return-response: true
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Organizations
