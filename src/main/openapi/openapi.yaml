      tags:
      - Organization Memberships
      x-accepts:
      - application/json
      x-tags:
      - tag: Organization Memberships
    get:
      operationId: checkOrganizationMembership
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      - description: organization id
        explode: false
        in: path
        name: orgId
