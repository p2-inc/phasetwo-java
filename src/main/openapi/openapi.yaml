      operationId: getOrganizationMemberships
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      - description: organization id
        explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: first
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: max
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: excludeAdminAccounts
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: includeOrgs
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/UserWithOrgsBriefRepresentation"
                type: array
          description: success
      summary: Get organization memberships
      tags:
      - Organization Memberships
      x-accepts:
      - application/json
      x-tags:
      - tag: Organization Memberships
  /{realm}/orgs/{orgId}/members/count:
    get:
      description: Get total number of members of a given organization
      operationId: getOrganizationMembershipsCount
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      - description: organization id
        explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: excludeAdminAccounts
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                format: int32
                type: integer
          description: success
      summary: Get organization members count
      tags:
      - Organization Memberships
      x-accepts:
      - application/json
      x-tags:
      - tag: Organization Memberships
