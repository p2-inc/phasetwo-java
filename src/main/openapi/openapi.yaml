        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      - description: organization id
        explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/OrganizationDomainRepresentation"
                type: array
          description: success
      summary: Get details for all domains owned by an organization
      tags:
      - Organization Domains
      x-accepts:
      - application/json
      x-tags:
      - tag: Organization Domains
  /{realm}/orgs/{orgId}/domains/{domainName}:
    get:
      operationId: getOrganizationDomain
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      - description: organization id
        explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - description: domain name
        explode: false
        in: path
        name: domainName
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDomainRepresentation"
          description: success
      summary: Get details for a domain owned by an organization
      tags:
      - Organization Domains
      x-accepts:
      - application/json
      x-tags:
      - tag: Organization Domains
  /{realm}/orgs/{orgId}/domains/{domainName}/verify:
    post:
      description: Initiate a verification check for the domain name owned by this
        organization
      operationId: verifyDomain
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      - description: organization id
        explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - description: domain name
        explode: false
        in: path
        name: domainName
        required: true
        schema:
          type: string
