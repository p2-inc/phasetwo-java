      operationId: addOrganizationMember
      parameters:
      - description: realm name (not id!)
        explode: false
        in: path
        name: realm
        required: true
        schema:
          type: string
        style: simple
      - description: organization id
        explode: false
        in: path
        name: orgId
        required: true
        schema:
          type: string
        style: simple
      - description: user id
        explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
